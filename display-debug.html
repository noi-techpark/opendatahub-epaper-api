<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ePaper Display Debugger</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 1.1rem; color: #aaa; margin-bottom: 16px; letter-spacing: 2px; text-transform: uppercase; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: #242424; border: 1px solid #333; border-radius: 4px; padding: 14px; flex: 1 1 340px; min-width: 280px; }
  .panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 12px; }
  label { display: block; font-size: 0.75rem; color: #999; margin-bottom: 3px; margin-top: 10px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=number], textarea {
    width: 100%; padding: 6px 8px; background: #1a1a1a; border: 1px solid #444;
    color: #e0e0e0; border-radius: 3px; font-family: monospace; font-size: 0.85rem;
  }
  input[type=text]:focus, input[type=number]:focus, textarea:focus {
    outline: none; border-color: #666;
  }
  textarea { resize: vertical; min-height: 48px; }
  button {
    margin-top: 12px; padding: 7px 14px; background: #333; border: 1px solid #555;
    color: #e0e0e0; border-radius: 3px; cursor: pointer; font-family: monospace;
    font-size: 0.85rem; transition: background 0.15s;
  }
  button:hover { background: #444; }
  button.primary { background: #2a4a2a; border-color: #4a8a4a; color: #8aca8a; }
  button.primary:hover { background: #2f5a2f; }
  button.active { background: #4a3a1a; border-color: #8a6a2a; color: #caaa5a; }
  button.active:hover { background: #5a4a1a; }
  button.danger { background: #3a1a1a; border-color: #7a3a3a; color: #ca7a7a; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  #image-panel { flex: 2 1 400px; }
  #image-wrap {
    background: #111; border: 1px solid #333; border-radius: 3px;
    min-height: 120px; display: flex; align-items: center; justify-content: center;
    overflow: auto; margin-top: 8px; padding: 8px;
  }
  #image-wrap img { max-width: 100%; display: block; image-rendering: pixelated; }
  #image-placeholder { color: #555; font-size: 0.8rem; }

  #log {
    margin-top: 16px; background: #111; border: 1px solid #333; border-radius: 4px;
    padding: 12px; font-size: 0.78rem; max-height: 280px; overflow-y: auto;
  }
  .log-entry { padding: 3px 0; border-bottom: 1px solid #222; line-height: 1.4; }
  .log-entry:last-child { border-bottom: none; }
  .log-time { color: #666; margin-right: 6px; }
  .log-ok { color: #6ab06a; }
  .log-err { color: #c06a6a; }
  .log-info { color: #6a9ab0; }
  .log-warn { color: #c0a06a; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.78rem; margin-top: 8px; }
  .kv .k { color: #888; }
  .kv .v { color: #e0e0e0; word-break: break-all; }
  .kv .v.changed { color: #f0c040; font-weight: bold; }
  .kv .v.same { color: #6ab06a; }
  .kv .v.missing { color: #c06a6a; }

  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 0.7rem;
    background: #333; color: #aaa; margin-left: 6px; vertical-align: middle;
  }
  .badge.green { background: #1a3a1a; color: #6ab06a; }
  .badge.red { background: #3a1a1a; color: #c06a6a; }
  .badge.yellow { background: #3a2a1a; color: #c0a06a; }

  hr { border: none; border-top: 1px solid #2a2a2a; margin: 14px 0; }
  #autorefresh-interval { width: 60px; display: inline; }
</style>
</head>
<body>

<h1>ePaper Display Debugger</h1>

<div class="row" style="margin-bottom: 16px;">
  <div class="panel" style="flex: 0 1 auto; min-width: 0;">
    <h2>Connection</h2>
    <label>API Base URL</label>
    <input type="text" id="apiBase" value="https://epaper.opendatahub.testingmachine.eu">
    <label>Display UUID</label>
    <input type="text" id="displayUuid" value="local-test">
  </div>
</div>

<div class="row">

  <!-- sync-status panel -->
  <div class="panel">
    <h2>POST /display/sync-status/{uuid}</h2>
    <label>Battery %</label>
    <input type="number" id="battery" value="87" min="0" max="100">
    <label>Error Message (empty = none)</label>
    <input type="text" id="errorMsg" value="" placeholder="e.g. E_INK_REFRESH_FAILED">
    <label>Warning Message (empty = none)</label>
    <input type="text" id="warnMsg" value="" placeholder="e.g. LOW_BATTERY">
    <div class="btn-row">
      <button class="primary" onclick="doSyncStatus()">Send sync-status</button>
    </div>
    <div id="sync-result" class="kv" style="display:none;"></div>
  </div>

  <!-- get-image panel -->
  <div class="panel" id="image-panel">
    <h2>GET /display/get-image/{uuid}</h2>
    <div class="kv" style="margin-top:0; margin-bottom: 10px;">
      <span class="k">convertToBMP</span><span class="v">true (fixed — display native format)</span>
      <span class="k">withTextFields</span><span class="v">true (renders dynamic fields)</span>
    </div>
    <div class="btn-row">
      <button class="primary" onclick="doGetImage()">Fetch image</button>
      <button id="autoRefreshBtn" onclick="toggleAutoRefresh()">Auto-refresh: OFF</button>
      <input type="number" id="autorefresh-interval" value="30" min="5" title="Interval in seconds">
      <span style="font-size:0.75rem; color:#666;">s</span>
    </div>

    <div id="hash-info" class="kv" style="display:none; margin-top: 10px;"></div>

    <div id="image-wrap">
      <span id="image-placeholder">No image fetched yet</span>
    </div>
  </div>

</div>

<div id="log"><div class="log-entry"><span class="log-info">▶ Debugger ready. Set the display UUID and use the buttons above.</span></div></div>

<script>
  // --- State ---
  let knownHash = null;   // hash returned by last sync-status
  let lastImageHash = null; // hash last confirmed via get-image (convertToBMP=true sets it server-side)
  let autoRefreshTimer = null;
  let autoRefreshOn = false;

  // --- Logging ---
  function log(msg, level = 'info') {
    const el = document.getElementById('log');
    const now = new Date().toTimeString().slice(0,8);
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.innerHTML = `<span class="log-time">${now}</span><span class="log-${level}">${msg}</span>`;
    el.prepend(div);
  }

  // --- MD5 (pure JS, RFC 1321) ---
  function md5(input) {
    // input: Uint8Array
    function safeAdd(x, y) { const lsw = (x & 0xFFFF) + (y & 0xFFFF); return (((x >> 16) + (y >> 16) + (lsw >> 16)) << 16) | (lsw & 0xFFFF); }
    function bitRotateLeft(num, cnt) { return (num << cnt) | (num >>> (32 - cnt)); }
    function md5cmn(q, a, b, x, s, t) { return safeAdd(bitRotateLeft(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b); }
    function md5ff(a,b,c,d,x,s,t){return md5cmn((b&c)|((~b)&d),a,b,x,s,t);}
    function md5gg(a,b,c,d,x,s,t){return md5cmn((b&d)|(c&(~d)),a,b,x,s,t);}
    function md5hh(a,b,c,d,x,s,t){return md5cmn(b^c^d,a,b,x,s,t);}
    function md5ii(a,b,c,d,x,s,t){return md5cmn(c^(b|(~d)),a,b,x,s,t);}

    const bytes = input;
    const byteLen = bytes.length;
    const wordCount = ((byteLen + 8) >>> 6) + 1;
    const M = new Int32Array(wordCount * 16);
    for (let i = 0; i < byteLen; i++) M[i >> 2] |= bytes[i] << ((i % 4) * 8);
    M[byteLen >> 2] |= 0x80 << ((byteLen % 4) * 8);
    M[wordCount * 16 - 2] = byteLen * 8;

    let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
    for (let i = 0; i < wordCount * 16; i += 16) {
      const [oa,ob,oc,od]=[a,b,c,d];
      a=md5ff(a,b,c,d,M[i+ 0], 7,-680876936);  b=md5ff(d,a,b,c,M[i+ 1],12,-389564586);
      c=md5ff(c,d,a,b,M[i+ 2],17, 606105819);  d=md5ff(b,c,d,a,M[i+ 3],22,-1044525330);
      a=md5ff(a,b,c,d,M[i+ 4], 7,-176418897);  b=md5ff(d,a,b,c,M[i+ 5],12, 1200080426);
      c=md5ff(c,d,a,b,M[i+ 6],17,-1473231341); d=md5ff(b,c,d,a,M[i+ 7],22,-45705983);
      a=md5ff(a,b,c,d,M[i+ 8], 7, 1770035416); b=md5ff(d,a,b,c,M[i+ 9],12,-1958414417);
      c=md5ff(c,d,a,b,M[i+10],17,-42063);       d=md5ff(b,c,d,a,M[i+11],22,-1990404162);
      a=md5ff(a,b,c,d,M[i+12], 7, 1804603682); b=md5ff(d,a,b,c,M[i+13],12,-40341101);
      c=md5ff(c,d,a,b,M[i+14],17,-1502002290); d=md5ff(b,c,d,a,M[i+15],22, 1236535329);
      a=md5gg(a,b,c,d,M[i+ 1], 5,-165796510);  b=md5gg(d,a,b,c,M[i+ 6], 9,-1069501632);
      c=md5gg(c,d,a,b,M[i+11],14, 643717713);  d=md5gg(b,c,d,a,M[i+ 0],20,-373897302);
      a=md5gg(a,b,c,d,M[i+ 5], 5,-701558691);  b=md5gg(d,a,b,c,M[i+10], 9, 38016083);
      c=md5gg(c,d,a,b,M[i+15],14,-660478335);  d=md5gg(b,c,d,a,M[i+ 4],20,-405537848);
      a=md5gg(a,b,c,d,M[i+ 9], 5, 568446438);  b=md5gg(d,a,b,c,M[i+14], 9,-1019803690);
      c=md5gg(c,d,a,b,M[i+ 3],14,-187363961);  d=md5gg(b,c,d,a,M[i+ 8],20,1163531501);
      a=md5gg(a,b,c,d,M[i+13], 5,-1444681467); b=md5gg(d,a,b,c,M[i+ 2], 9,-51403784);
      c=md5gg(c,d,a,b,M[i+ 7],14,1735328473);  d=md5gg(b,c,d,a,M[i+12],20,-1926607734);
      a=md5hh(a,b,c,d,M[i+ 5], 4,-378558);     b=md5hh(d,a,b,c,M[i+ 8],11,-2022574463);
      c=md5hh(c,d,a,b,M[i+11],16, 1839030562); d=md5hh(b,c,d,a,M[i+14],23,-35309556);
      a=md5hh(a,b,c,d,M[i+ 1], 4,-1530992060); b=md5hh(d,a,b,c,M[i+ 4],11, 1272893353);
      c=md5hh(c,d,a,b,M[i+ 7],16,-155497632);  d=md5hh(b,c,d,a,M[i+10],23,-1094730640);
      a=md5hh(a,b,c,d,M[i+13], 4, 681279174);  b=md5hh(d,a,b,c,M[i+ 0],11,-358537222);
      c=md5hh(c,d,a,b,M[i+ 3],16,-722521979);  d=md5hh(b,c,d,a,M[i+ 6],23, 76029189);
      a=md5hh(a,b,c,d,M[i+ 9], 4,-640364487);  b=md5hh(d,a,b,c,M[i+12],11,-421815835);
      c=md5hh(c,d,a,b,M[i+15],16, 530742520);  d=md5hh(b,c,d,a,M[i+ 2],23,-995338651);
      a=md5ii(a,b,c,d,M[i+ 0], 6,-198630844);  b=md5ii(d,a,b,c,M[i+ 7],10,1126891415);
      c=md5ii(c,d,a,b,M[i+14],15,-1416354905); d=md5ii(b,c,d,a,M[i+ 5],21,-57434055);
      a=md5ii(a,b,c,d,M[i+12], 6, 1700485571); b=md5ii(d,a,b,c,M[i+ 3],10,-1894986606);
      c=md5ii(c,d,a,b,M[i+10],15,-1051523);    d=md5ii(b,c,d,a,M[i+ 1],21,-2054922799);
      a=md5ii(a,b,c,d,M[i+ 8], 6, 1873313359); b=md5ii(d,a,b,c,M[i+15],10,-30611744);
      c=md5ii(c,d,a,b,M[i+ 6],15,-1560198380); d=md5ii(b,c,d,a,M[i+13],21,1309151649);
      a=md5ii(a,b,c,d,M[i+ 4], 6,-145523070);  b=md5ii(d,a,b,c,M[i+11],10,-1120210379);
      c=md5ii(c,d,a,b,M[i+ 2],15, 718787259);  d=md5ii(b,c,d,a,M[i+ 9],21,-343485551);
      a=safeAdd(a,oa); b=safeAdd(b,ob); c=safeAdd(c,oc); d=safeAdd(d,od);
    }
    return [a,b,c,d].map(n => {
      let s = '';
      for (let j = 0; j < 4; j++) s += ('0' + ((n >> (j*8)) & 0xff).toString(16)).slice(-2);
      return s;
    }).join('');
  }

  // --- Helpers ---
  function base() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
  function uuid() { return document.getElementById('displayUuid').value.trim(); }

  function setKV(elId, pairs, show = true) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = pairs.map(([k, v, cls]) =>
      `<span class="k">${k}</span><span class="v ${cls || ''}">${v}</span>`
    ).join('');
    el.style.display = show ? 'grid' : 'none';
  }

  // --- sync-status ---
  async function doSyncStatus() {
    const id = uuid();
    const payload = {
      batteryPercentage: parseInt(document.getElementById('battery').value) || 0,
      errorMessage: document.getElementById('errorMsg').value || null,
      warningMessage: document.getElementById('warnMsg').value || null,
    };
    log(`→ POST /display/sync-status/${id}  body=${JSON.stringify(payload)}`, 'info');

    try {
      const res = await fetch(`${base()}/display/sync-status/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const statusText = `${res.status} ${res.statusText}`;
      if (!res.ok) {
        log(`✗ sync-status  HTTP ${statusText}`, 'err');
        setKV('sync-result', [
          ['status', statusText, 'missing'],
          ['body', await res.text(), 'missing'],
        ]);
        return;
      }

      const serverHash = (await res.text()).trim();
      knownHash = serverHash === 'no-hash' ? null : serverHash;

      log(`✓ sync-status  HTTP ${statusText}  hash=${serverHash}`, 'ok');

      let hashCls = '';
      let hashNote = serverHash;
      if (serverHash === 'no-hash') {
        hashCls = 'missing';
        hashNote = 'no-hash (display should fetch image unconditionally)';
      } else if (lastImageHash && serverHash === lastImageHash) {
        hashCls = 'same';
        hashNote += '  ✓ matches last fetched — display would SKIP refresh';
      } else if (lastImageHash) {
        hashCls = 'changed';
        hashNote += '  ⚠ differs from last fetched — display would FETCH new image';
      }

      setKV('sync-result', [
        ['status', statusText, 'log-ok'],
        ['server hash', hashNote, hashCls],
        ['battery sent', payload.batteryPercentage + '%'],
        ['errorMessage', payload.errorMessage ?? '(none)'],
        ['warningMessage', payload.warningMessage ?? '(none)'],
      ]);
    } catch (e) {
      log(`✗ sync-status  ${e.message}`, 'err');
      setKV('sync-result', [['error', e.message, 'missing']]);
    }
  }

  // --- get-image ---
  async function doGetImage() {
    const id = uuid();
    const url = `${base()}/display/get-image/${id}?convertToBMP=true&withTextFields=true`;
    log(`→ GET /display/get-image/${id}?convertToBMP=true&withTextFields=true`, 'info');

    try {
      const res = await fetch(url);
      const statusText = `${res.status} ${res.statusText}`;

      if (!res.ok) {
        log(`✗ get-image  HTTP ${statusText}`, 'err');
        setKV('hash-info', [['status', statusText, 'missing']]);
        return;
      }

      const blob = await res.blob();
      const arrayBuf = await blob.arrayBuffer();
      const bytes = new Uint8Array(arrayBuf);
      const computedHash = md5(bytes);
      lastImageHash = computedHash;

      let hashCmp = '';
      let hashNote = computedHash;
      if (knownHash === null) {
        hashCmp = 'warn';
        hashNote += '  (no sync-status hash to compare against)';
      } else if (computedHash === knownHash) {
        hashCmp = 'same';
        hashNote += '  ✓ matches server hash';
      } else {
        hashCmp = 'changed';
        hashNote += '  ⚠ differs from server hash';
      }

      const sizeKB = (bytes.length / 1024).toFixed(1);
      const contentType = res.headers.get('content-type') || 'unknown';
      log(`✓ get-image  HTTP ${statusText}  ${sizeKB} KB  md5=${computedHash}`, 'ok');

      setKV('hash-info', [
        ['status', statusText, 'log-ok'],
        ['content-type', contentType],
        ['size', sizeKB + ' KB'],
        ['md5 (computed)', hashNote, hashCmp],
        ['server hash (sync)', knownHash ?? '(run sync-status first)'],
      ]);

      // Show image — browsers can't render BMP natively in <img> in all cases,
      // so we detect and fall back to a canvas renderer if needed.
      const wrap = document.getElementById('image-wrap');
      wrap.innerHTML = '';

      const objectUrl = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        wrap.appendChild(img);
        URL.revokeObjectURL(objectUrl);
      };
      img.onerror = () => {
        // BMP fallback: decode manually and draw on canvas
        URL.revokeObjectURL(objectUrl);
        log('⚠ Browser cannot render BMP directly — using canvas fallback', 'warn');
        renderBMPToCanvas(bytes, wrap);
      };
      img.src = objectUrl;
      img.alt = `Display image for ${id}`;
      img.style.cssText = 'max-width:100%; image-rendering:pixelated;';

    } catch (e) {
      log(`✗ get-image  ${e.message}`, 'err');
      setKV('hash-info', [['error', e.message, 'missing']]);
    }
  }

  // Minimal BMP decoder for 1bpp/4bpp/8bpp/24bpp uncompressed BMPs
  function renderBMPToCanvas(bytes, container) {
    try {
      const view = new DataView(bytes.buffer);
      if (view.getUint16(0, true) !== 0x4D42) { container.textContent = 'Not a valid BMP file'; return; }

      const pixelOffset = view.getUint32(10, true);
      const width       = view.getInt32(18, true);
      const height      = view.getInt32(22, true);
      const bpp         = view.getUint16(28, true);
      const compression = view.getUint32(30, true);
      const absHeight   = Math.abs(height);
      const topDown     = height < 0;

      if (compression !== 0 && compression !== 3) {
        container.textContent = `BMP compression ${compression} not supported in fallback renderer`;
        return;
      }

      // Color table
      const colorTableOffset = 54;
      const colorCount = (bpp <= 8) ? (1 << bpp) : 0;
      const palette = [];
      for (let i = 0; i < colorCount; i++) {
        const off = colorTableOffset + i * 4;
        palette.push([bytes[off+2], bytes[off+1], bytes[off], 255]);
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = absHeight;
      canvas.style.cssText = 'max-width:100%; image-rendering:pixelated;';
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, absHeight);
      const d = imgData.data;

      const rowSize = Math.floor((bpp * width + 31) / 32) * 4;

      for (let row = 0; row < absHeight; row++) {
        const srcRow = topDown ? row : (absHeight - 1 - row);
        const rowOffset = pixelOffset + srcRow * rowSize;

        for (let col = 0; col < width; col++) {
          let r, g, b, a = 255;

          if (bpp === 1) {
            const byteIdx = rowOffset + Math.floor(col / 8);
            const bit = 7 - (col % 8);
            const idx = (bytes[byteIdx] >> bit) & 1;
            [r, g, b, a] = palette[idx];
          } else if (bpp === 4) {
            const byteIdx = rowOffset + Math.floor(col / 2);
            const idx = (col % 2 === 0) ? (bytes[byteIdx] >> 4) & 0xf : bytes[byteIdx] & 0xf;
            [r, g, b, a] = palette[idx];
          } else if (bpp === 8) {
            [r, g, b, a] = palette[bytes[rowOffset + col]];
          } else if (bpp === 24) {
            const off = rowOffset + col * 3;
            b = bytes[off]; g = bytes[off+1]; r = bytes[off+2];
          } else if (bpp === 32) {
            const off = rowOffset + col * 4;
            b = bytes[off]; g = bytes[off+1]; r = bytes[off+2]; a = bytes[off+3];
          } else {
            container.textContent = `BMP bpp=${bpp} not supported in fallback renderer`; return;
          }

          const dIdx = (row * width + col) * 4;
          d[dIdx] = r; d[dIdx+1] = g; d[dIdx+2] = b; d[dIdx+3] = a;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      container.appendChild(canvas);
      log(`✓ BMP rendered via canvas  ${width}×${absHeight}  ${bpp}bpp`, 'ok');
    } catch (e) {
      container.textContent = `BMP render error: ${e.message}`;
      log(`✗ BMP canvas render  ${e.message}`, 'err');
    }
  }

  // --- Auto-refresh ---
  function toggleAutoRefresh() {
    if (autoRefreshOn) {
      stopAutoRefresh();
    } else {
      startAutoRefresh();
    }
  }

  function startAutoRefresh() {
    autoRefreshOn = true;
    const btn = document.getElementById('autoRefreshBtn');
    btn.textContent = 'Auto-refresh: ON';
    btn.classList.add('active');
    const secs = Math.max(5, parseInt(document.getElementById('autorefresh-interval').value) || 30);
    log(`↻ Auto-refresh started — every ${secs}s`, 'info');
    scheduleNext(secs);
  }

  function scheduleNext(secs) {
    if (!autoRefreshOn) return;
    autoRefreshTimer = setTimeout(async () => {
      if (!autoRefreshOn) return;
      await doSyncStatus();
      await doGetImage();
      const secs2 = Math.max(5, parseInt(document.getElementById('autorefresh-interval').value) || 30);
      scheduleNext(secs2);
    }, secs * 1000);
  }

  function stopAutoRefresh() {
    autoRefreshOn = false;
    clearTimeout(autoRefreshTimer);
    const btn = document.getElementById('autoRefreshBtn');
    btn.textContent = 'Auto-refresh: OFF';
    btn.classList.remove('active');
    log('↻ Auto-refresh stopped', 'info');
  }
</script>
</body>
</html>
